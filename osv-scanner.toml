# OSV-Scanner configuration for the lockfiles in this directory
# (package-lock.json, uv.lock). See .github/workflows/osv-scanner.yml.
#
# Every entry must say why the advisory does not apply to how we use the
# package, and must carry an ignoreUntil date so it resurfaces for review.

[[IgnoredVulns]]
# minimatch globparts-amplification DoS, fixed only in the 11.x line.
# minimatch 10.2.6 / 9.0.9 are pulled solely by build/dev tooling (eslint,
# @eslint/config-array, @typescript-eslint/typescript-estree, app-builder-lib,
# @electron/universal) and only ever see glob patterns we write in our own
# configs, never user input. 11.0 removes makeRe()/Minimatch#regexp and changes
# the shape of Minimatch#set, which app-builder-lib and eslint read, and none
# of those consumers accepts ^11 yet — forcing it via overrides risks silently
# wrong file matching in packaging. Drop this once they move to minimatch 11.
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-17
reason = "dev/build-only minimatch (eslint, electron-builder) with trusted patterns; 11.x breaks consumer APIs"


# --- Electron held at 40.10.6 -------------------------------------------------
# None of the advisories below has a fix on the Electron 40 line; closing them
# all needs 42.11.16+ (the eMudhra certificate mitigation never reached 41.x).
# Electron 42 moved macOS notifications to UNNotification, which refuses
# ad-hoc-signed apps, and the macOS release is ad-hoc signed today (no
# Developer ID), so 42 would silently stop turn/approval notifications on
# macOS (verified: Electron 40 shows the notification, 42 emits 'failed'
# UNErrorDomain 1). Revisit together with Developer ID signing / Electron 43+.

[[IgnoredVulns]]
# electron: SameSite cookie restrictions are not applied to windows opened from links
id = "GHSA-2p8c-gr87-2676"
ignoreUntil = 2027-02-17
reason = "Electron 42 breaks macOS notifications on ad-hoc-signed builds (UNNotification); revisit with Developer ID signing / Electron 43+"

