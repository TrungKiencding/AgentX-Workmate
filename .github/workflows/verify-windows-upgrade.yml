name: Verify published Windows upgrade

on:
  workflow_dispatch:
    inputs:
      previous_installer_url:
        description: HTTPS URL of the previous NSIS installer
        required: true
        type: string
      previous_sha256:
        description: SHA-256 of that previous installer
        required: true
        type: string
      release_tag:
        description: GitHub release containing the new installer
        default: desktop-v1.0.5
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - run: npm i -g npm@12
      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Upgrade the previously published NSIS install and preserve its data
        shell: powershell
        env:
          PREVIOUS_INSTALLER_URL: ${{ inputs.previous_installer_url }}
          PREVIOUS_SHA256: ${{ inputs.previous_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PREVIOUS_INSTALLER_URL -notmatch '^https://') { throw 'The previous installer must use HTTPS' }
          $old = Join-Path $env:RUNNER_TEMP 'previous-workmate.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $env:PREVIOUS_INSTALLER_URL -OutFile $old
          if ((Get-FileHash $old -Algorithm SHA256).Hash -ne $env:PREVIOUS_SHA256) { throw 'Previous installer hash mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'agentx-upgrade-installed'
          $oldProcess = Start-Process $old -ArgumentList '/S', "/D=$destination" -PassThru
          if (-not $oldProcess.WaitForExit(300000)) { throw 'Previous installer did not exit within five minutes' }
          if ($oldProcess.ExitCode -ne 0) { throw 'Previous NSIS install failed' }
          $executable = Join-Path $destination 'AgentX Workmate.exe'
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $executable } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $before = (Get-Item $executable).VersionInfo.ProductVersion
          Write-Output "Installed previous desktop $before"
          $dataRoots = @((Join-Path $env:APPDATA 'AgentX Workmate'), (Join-Path $env:LOCALAPPDATA 'agentx'))
          foreach ($root in $dataRoots) {
            New-Item -ItemType Directory -Force $root | Out-Null
            Set-Content -LiteralPath (Join-Path $root 'upgrade-data-must-survive.txt') -Value 'preserve existing user data'
          }
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AgentX.lnk'
          $startLink = Join-Path ([Environment]::GetFolderPath('Programs')) 'AgentX.lnk'
          Set-Content -LiteralPath $desktopLink -Value 'legacy shortcut'
          Set-Content -LiteralPath $startLink -Value 'legacy shortcut'
          $state = Join-Path $env:RUNNER_TEMP 'workmate-upgrade-state'
          $legacy = Join-Path $state 'legacy-plugins'
          New-Item -ItemType Directory -Force $legacy | Out-Null
          git fetch origin tag desktop-v1.0.5 --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Could not obtain old plugin code' }
          $archive = Join-Path $env:RUNNER_TEMP 'old-plugins.tar'
          git archive --format=tar --output=$archive desktop-v1.0.5 plugins
          tar -xf $archive -C $legacy --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract old plugins' }
          node apps/desktop/scripts/test-windows-upgrade-state.mjs before $executable $state
          if ($LASTEXITCODE -ne 0) { throw 'Old Windows login persistence failed' }
          $downloads = Join-Path $env:RUNNER_TEMP 'new-release'
          New-Item -ItemType Directory $downloads | Out-Null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*-win-x64.exe' --dir $downloads --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 29) { throw 'The new release is unavailable' }
            Start-Sleep -Seconds 20
          }
          $new = Get-ChildItem $downloads -Filter '*.exe' | Select-Object -First 1
          # Same NSIS upgrade mode as the app; launch is exercised below under an isolated profile.
          $newProcess = Start-Process $new.FullName -ArgumentList '--updated', '/S', "/D=$destination" -PassThru
          if (-not $newProcess.WaitForExit(300000)) { throw 'New installer did not exit within five minutes' }
          if ($newProcess.ExitCode -ne 0) { throw 'NSIS upgrade failed' }
          foreach ($root in $dataRoots) {
            if ((Get-Content -LiteralPath (Join-Path $root 'upgrade-data-must-survive.txt')) -ne 'preserve existing user data') { throw "User data lost under $root" }
          }
          if ((Test-Path -LiteralPath $desktopLink) -or (Test-Path -LiteralPath $startLink)) { throw 'Legacy shortcuts remain' }
          $after = (Get-Item $executable).VersionInfo.ProductVersion
          if ([version]$after -le [version]$before) { throw "Desktop did not advance: $before -> $after" }
          node apps/desktop/scripts/test-windows-upgrade-state.mjs after $executable $state
          if ($LASTEXITCODE -ne 0) { throw 'Windows upgrade lost credentials or data' }
          node apps/desktop/scripts/test-windows-upgrade-state.mjs restart $executable $state
          if ($LASTEXITCODE -ne 0) { throw 'Windows restart lost credentials or data' }
          Write-Output "Desktop upgraded $before -> $after; user data preserved and legacy shortcuts removed"
          "AGENTX_E2E_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise the upgraded app and repeated restarts
        working-directory: apps/desktop
        shell: powershell
        env:
          AGENTX_E2E_RELEASE: '1'
          AGENTX_UPGRADE_OLD_PLUGINS: ${{ runner.temp }}/workmate-upgrade-state/legacy-plugins
        run: npx playwright test e2e/install-update-release.spec.ts --workers=1 --retries=0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-upgrade-diagnostics
          path: |
            ${{ runner.temp }}/workmate-upgrade-state/*-report.json
            apps/desktop/playwright-report
            apps/desktop/test-results
