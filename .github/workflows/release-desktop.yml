# .github/workflows/release-desktop.yml
#
# Builds the AgentX Workmate desktop installers on the operating systems that
# can actually produce them, because one machine cannot.
#
# The macOS dev box that cuts releases by hand can build the NSIS .exe (Windows
# resources are edited in pure JS since `signExecutable: false` replaced
# `signAndEditExecutable: false`), but it cannot build the .msi: that target
# drives the WiX toolset, a Windows binary electron-builder runs through Wine,
# which fails before it starts on Apple Silicon. A windows-latest runner has
# WiX natively, so the target that could never be built locally is built here.
#
# It also removes the step where a person remembers to run two commands and
# copy six files into the right folder.
#
# Triggers:
#   - a `desktop-v*` tag  → build, then attach the installers to the GitHub
#                           Release for that tag
#   - manual dispatch     → build and keep the installers as workflow artifacts,
#                           so a build can be exercised without cutting a release
name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      msi:
        description: "Also build the Windows .msi (needs the WiX toolset; Windows runner only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not throw away a good build of the other —
      # a released .dmg with no .exe beside it is still worth having while the
      # Windows failure is diagnosed.
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg + zip)
            os: macos-14
            artifact: macos
          - name: Windows (nsis)
            os: windows-latest
            artifact: windows

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Require release tags to originate from main
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Merge and push the release commit to main before creating its tag."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'

      - run: python -m pip install uv==0.11.7

      - name: grab npm 12
        run: npm i -g npm@12

      # The desktop workspace resolves through the repo root, and `npm ci`
      # refuses when apps/desktop/package.json and the lockfile disagree on the
      # version — which is the check that catches a bump applied to only one.
      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Exercise install and update regressions on the native OS
        working-directory: apps/desktop
        run: npx vitest run --project electron electron/install-update-regression.test.ts electron/checkout-pin.test.ts electron/bootstrap-runner.test.ts electron/active-runtime-state.test.ts electron/stale-checkout.test.ts electron/app-update/ electron/update-gate.test.ts electron/update-marker.test.ts electron/bundled-runtime-preview.test.ts scripts/bundled-runtime.test.mjs scripts/release-feed.test.ts

      - name: Build the renderer and main bundle
        working-directory: apps/desktop
        run: npm run build

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          # Signing and notarisation are opt-in: set these repository secrets
          # and the same command signs, staples, and produces a .dmg that opens
          # without a Gatekeeper warning. Left unset, the build still succeeds
          # and produces an UNSIGNED bundle — which users must right-click →
          # Open to launch. scripts/notarize.mjs skips itself when the Apple
          # credentials are absent and says so in the log.
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CSC_LINK != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          npm run builder -- --mac --publish never

      # nsis always; msi only when asked for, because it is the slow half and
      # nothing has ever shipped one. `--x64 --arm64` matches what releases have
      # carried to date.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npm run builder -- --win nsis ${{ (inputs.msi && 'msi') || '' }} --x64 --publish never

      # An NSIS installer's payload is compressed, so the release machine cannot
      # read which commit a CI-built .exe pins. This records it, with each
      # installer's sha256, in a file the release carries beside them; that is
      # what `npm run release:feed -- build --from-github <tag>` checks.
      - name: Record the commit the Windows installers pin
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node scripts/write-win-build-manifest.mjs

      - name: Validate legacy migration and offline bundled runtime (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./apps/desktop/scripts/verify-windows-bundled-release.ps1

      - name: Validate relocated official DMG and backend (macOS)
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/smoke-runtime-preview.mjs --production

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: release-test-diagnostics-${{ matrix.artifact }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
            ${{ runner.temp }}/windows-release-upgrade/*-report.json
            ${{ runner.temp }}/release-fresh/*.json
            ${{ runner.temp }}/release-fresh/user-home/logs/desktop.log
            ${{ runner.temp }}/release-migrated/*.json
            ${{ runner.temp }}/release-migrated/user-home/logs/desktop.log
            apps/desktop/release/runtime-preview-smoke.*

      # The build already refuses to produce an unbranded Windows exe
      # (scripts/verify-win-exe-identity.mjs runs in the afterSign hook), so
      # reaching this step means the icon and version strings are AgentX's.
      # This asserts the artifacts themselves exist, so an empty upload cannot
      # look like a successful release.
      - name: Check the artifacts exist
        working-directory: apps/desktop
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/AgentXWorkmate-*.dmg release/AgentXWorkmate-*.exe release/AgentXWorkmate-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers were produced in apps/desktop/release/"
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentx-workmate-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/AgentXWorkmate-*.dmg
            apps/desktop/release/AgentXWorkmate-*.exe
            apps/desktop/release/AgentXWorkmate-*.msi
            apps/desktop/release/AgentXWorkmate-*.zip
            apps/desktop/release/AgentXWorkmate-*-build.json
            ${{ runner.temp }}/windows-release-upgrade/*-report.json
            ${{ runner.temp }}/release-fresh/runtime-smoke-report.json
            ${{ runner.temp }}/release-migrated/runtime-smoke-report.json
            apps/desktop/release/runtime-preview-smoke.json

  release:
    name: Attach to the release
    needs: build
    # Only a tag cuts a release. A manual dispatch is for exercising the build,
    # and should not be able to publish one.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true

      # `gh` is preinstalled on the runner, so this needs no third-party action
      # in a repo that pins and audits every one it takes.
      - name: Upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing was downloaded from the build jobs."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            || echo "Release already exists; uploading into it."
          # Published bytes are immutable: a rerun must not overwrite installers
          # already referenced by the signed download-site feed.
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}"
