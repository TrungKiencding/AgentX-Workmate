# AgentX MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: webmate
description: >-
  AgentX WebMate — run browser tasks in the user's own signed-in Chrome through
  the WebMate extension (stdio bridge on 127.0.0.1:17374, Chromium only).
source: https://github.com/astralxkienlt/agentx-webmate/tree/main/mcp-server

# The MCP server ships with AgentX as ONE file next to this manifest
# (server/agentx-webmate-mcp.mjs, built in the WebMate repo with
# `npm --prefix mcp-server run build:skill`; see server/VERSION). Nothing is
# cloned or built on the user's machine. ${INSTALL_DIR} is this directory,
# ${NODE} the Node.js AgentX manages (falls back to `node` on PATH), and
# ${AGENTX_ROOT} the install root where Workmate keeps the extension folder
# (~/.agentx/webmate, %LOCALAPPDATA%\agentx\webmate) — the server reads
# pairing.json there and writes state.json for the desktop app.
transport:
  type: stdio
  command: "${NODE}"
  args:
    - "${INSTALL_DIR}/server/agentx-webmate-mcp.mjs"
  env:
    WEBMATE_DIR: "${AGENTX_ROOT}/webmate"

install:
  type: bundled
  bundle: server/agentx-webmate-mcp.mjs
  # SHA-256 of server/agentx-webmate-mcp.mjs (also in server/SHA256SUMS).
  # Refresh both with `python scripts/vendor_webmate_server.py --from <webmate checkout>`.
  sha256: 9733ca2837a4b75fea78869b939dc01e9b64f1269abbf842a92250a253656dda
  # `agentx mcp install webmate --dev` builds from this pinned checkout instead
  # of using the bundled file (needs git + npm). Full commit SHA, never a branch.
  dev:
    type: git
    url: https://github.com/astralxkienlt/agentx-webmate.git
    ref: 4b7cdcdaf5a9701525bf7eca65cc8d088af6ae2b
    entry: mcp-server/dist/index.js
    bootstrap:
      - "npm --prefix mcp-server ci --no-audit --no-fund"
      - "npm --prefix mcp-server run build"

# No credentials: the extension runs inside the user's already-authenticated
# browser session and the bridge is loopback-only. A Workmate-managed install
# adds a pairing token (pairing.json ↔ workmate.json) so only the extension
# Workmate installed can be driven from this port.
auth:
  type: none

# All six tools are task-level (no raw click/type primitives), so the full
# surface is the safe default. Runs default to permission_mode 'bypass'.
tools:
  default_enabled:
    - webmate_connection
    - webmate_run
    - webmate_extract
    - webmate_status
    - webmate_respond
    - webmate_abort

post_install: |
  Connect the browser (Chromium only — Chrome, Edge, Brave):
    - AgentX Workmate desktop: the extension folder is installed automatically
      and Workmate → Settings → Browser walks you through loading it into your
      browser (Developer mode → drag the "AgentX WebMate" folder onto
      chrome://extensions). Once it connects, nothing else to configure.
    - Other hosts: load a WebMate build unpacked and check Settings → General →
      Advanced → Cloud bridge shows ws://127.0.0.1:17374/extension, enabled.
  Then start a new AgentX session and ask it to call webmate_connection.

  The extension holds ONE bridge socket at a time: 17373 (WebMate Cloud),
  17374 (this server), 17375 (LM Studio plugin). The bridge is loopback-only,
  so AgentX must run on the same machine as the browser (or forward the port
  over SSH: `ssh -L 17374:127.0.0.1:17374 <host>` from the browser machine).

  Failures come back with a code the desktop app understands:
  WEBMATE_NOT_INSTALLED, WEBMATE_NOT_CONNECTED, WEBMATE_NOT_SIGNED_IN,
  WEBMATE_OUTDATED, WEBMATE_PORT_IN_USE.
