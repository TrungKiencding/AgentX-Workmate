<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#011627" />

    <!-- Title and description are rewritten by the i18n provider on mount; these
         are the Vietnamese defaults, which is what a crawler without JS gets. -->
    <title>AgentX Workmate — đồng nghiệp AI chạy trên máy bạn</title>
    <meta
      name="description"
      content="Tác nhân AI tự học, chạy ngay trên máy của bạn: mở terminal, đọc file, tự viết kỹ năng mới sau mỗi việc khó, và trả lời bạn từ Telegram, Discord hay Slack. Mã nguồn mở, giấy phép MIT."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The two faces the page is set in, preloaded because the display line is
         the LCP element and a swap on it is the flash people notice. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable-vietnamese.woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgentX Workmate" />
    <meta
      property="og:description"
      content="Đồng nghiệp AI chạy trên máy bạn. Mã nguồn mở, giấy phép MIT."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
